# =====================================================
# basic setup
# =====================================================
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-ghostty:RGB"
set -g focus-events on
set -sg escape-time 0
set -g mouse on
set -g display-time 1000
set -g history-limit 50000
set -g set-clipboard on

# =====================================================
# prefix
# =====================================================
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# =====================================================
# reload
# =====================================================
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# =====================================================
# split / window / pane
# =====================================================
# split: open in current dir, then even out the layout
bind v split-window -h -c "#{pane_current_path}" \; select-layout even-horizontal
bind s split-window -v -c "#{pane_current_path}" \; select-layout even-vertical
# keep tmux defaults too (same as a stock tmux on servers)
bind % split-window -h
bind '"' split-window -v

bind c new-window -c "#{pane_current_path}"

# switch pane: matches nvim's C-w hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane size
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# kill all other panes
bind e kill-pane -a

# lazygit popup in current dir
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E lazygit

# =====================================================
# serial
# =====================================================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# =====================================================
# copy mode
# =====================================================
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# =====================================================
# theme: cream-black (transparent status bar + pills)
# =====================================================
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=#6b675c"
set -g status-left ""
set -g status-right-length 100

# 非當前 window：暗字
set -g window-status-separator " "
set -g window-status-format "#[fg=#6b675c,bg=default] #I #W "

# 當前 window：奶油色圓角 pill
set -g window-status-current-format "#[fg=#e6dfc8,bg=default]#[fg=#0d0d0d,bg=#e6dfc8,bold]#I #W#[fg=#e6dfc8,bg=default,nobold]"

# 右側 session pill（橘色圖示 + 暗底名稱）
set -g status-right "#[fg=#d9a066,bg=default]#[fg=#0d0d0d,bg=#d9a066] #[fg=#e6dfc8,bg=#26241f] #S #[fg=#26241f,bg=default]"

# pane 邊框
set -g pane-border-style "fg=#2a2825"
set -g pane-active-border-style "fg=#6b675c"

# 非當前 pane：文字變暗，一眼看出焦點在哪
# active 要給明確顏色：fg=default 在 tmux 是「不覆蓋」，會沿用 window-style 的暗色
set -g window-style "fg=#6b675c"
set -g window-active-style "fg=#e6dfc8"

# 訊息列（例如 reloaded）
set -g message-style "bg=#26241f,fg=#e6dfc8"
