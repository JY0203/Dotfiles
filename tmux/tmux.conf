# =====================================================
# basic setup
# =====================================================
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-ghostty:RGB"
set -g focus-events on
set -sg escape-time 0
set -g mouse on
set -g display-time 1000

# =====================================================
# reload
# =====================================================
unbind r
bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# =====================================================
# prefix
# =====================================================
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# =====================================================
# split / window / pane
# =====================================================
unbind '"'
unbind %
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w kill-pane
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4

# switch pane: Option + hjkl
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# pane size
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =====================================================
# serial
# =====================================================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# =====================================================
# copy mode
# =====================================================
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# =====================================================
# theme: cream-black (transparent status bar + pills)
# =====================================================
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=#6b675c"
set -g status-left ""
set -g status-right-length 100

# 非當前 window：暗字
set -g window-status-separator " "
set -g window-status-format "#[fg=#6b675c,bg=default] #I #W "

# 當前 window：奶油色圓角 pill
set -g window-status-current-format "#[fg=#e6dfc8,bg=default]\ue0b6#[fg=#0d0d0d,bg=#e6dfc8,bold]#I #W#[fg=#e6dfc8,bg=default,nobold]\ue0b4"

# 右側 session pill（橘色圖示 + 暗底名稱）
set -g status-right "#[fg=#d9a066,bg=default]\ue0b6#[fg=#0d0d0d,bg=#d9a066]\uf07b #[fg=#e6dfc8,bg=#26241f] #S #[fg=#26241f,bg=default]\ue0b4"

# pane 邊框
set -g pane-border-style "fg=#2a2825"
set -g pane-active-border-style "fg=#6b675c"

# 訊息列（例如 reloaded）
set -g message-style "bg=#26241f,fg=#e6dfc8"
